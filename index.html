<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/svg+xml" href="/macbook.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Playwrite+US+Trad:wght@100..400&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
		/>
		<script>
			// Apply the persisted appearance before first paint so there is no flash.
			// Defaults to dark, matching the reference design.
			try {
				var stored = localStorage.getItem('theme');
				if (stored !== 'light') document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		<title>Mohamed Aashir S</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this site.</noscript>
		<div id="app"></div>
		<script prerender type="module" src="/src/index.tsx"></script>
	</body>
</html>
